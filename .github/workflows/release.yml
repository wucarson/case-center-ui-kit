# main 有新的 changeset：開（或更新）「Version Packages」PR，彙整版號與 CHANGELOG。
# 合併那個 PR（main 上沒有待處理的 changeset）：建置並發佈到 GitHub Packages，已發佈的版本會跳過。
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: 版號與發佈
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@wucarson'
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          title: 'Facet：版號與更新紀錄'
          commit: 'Facet：版號與更新紀錄'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
